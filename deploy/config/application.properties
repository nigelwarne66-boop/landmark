# ── Landmark Reporting — per-client database configuration ───────────────────
# Place this file at:  <install-dir>\config\application.properties
# It overrides the defaults baked into the application JAR.

# Supported databases: MySQL and MariaDB only.
# The application uses MySQL-dialect SQL throughout (NOW(), LIMIT, ON DUPLICATE KEY, etc.)
# and is not compatible with SQL Server without significant rewriting.

# MySQL (most common)
spring.datasource.url=jdbc:mysql://SERVER:3306/lmextract?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Australia/Perth
spring.datasource.username=landmark_user
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jooq.sql-dialect=MYSQL

# MariaDB — uncomment and comment out the MySQL block above
#spring.datasource.url=jdbc:mariadb://SERVER:3306/lmextract
#spring.datasource.username=landmark_user
#spring.datasource.password=CHANGE_ME
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.jooq.sql-dialect=MARIADB
